name: Import Angles IGN terrain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terrain.yml'
      - 'scripts/fetch-angles-terrain.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sample verified IGN RGE ALTI terrain
        run: python3 scripts/fetch-angles-terrain.py
      - uses: actions/upload-artifact@v4
        with:
          name: angles-ign-terrain
          path: public/data/angles-terrain.json
      - name: Commit verified terrain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/angles-terrain.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified IGN RGE ALTI terrain for Angles"
            # Other development commits may land while the import runs.
            # Replay this data-only commit onto the newest main before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Import conflicts with concurrent changes; stopping safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push detected (attempt ${attempt}/5); retrying..."
              sleep 2
            done
            echo "Could not publish after five safe retries."
            exit 1
          fi
