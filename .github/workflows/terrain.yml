name: Import Angles IGN terrain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terrain.yml'
      - 'scripts/fetch-angles-terrain.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sample verified IGN RGE ALTI terrain
        run: python3 scripts/fetch-angles-terrain.py
      - uses: actions/upload-artifact@v4
        with:
          name: angles-ign-terrain
          path: public/data/angles-terrain.json
      - name: Commit verified terrain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/angles-terrain.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified IGN RGE ALTI terrain for Angles"
            git push origin HEAD:main
          fi
