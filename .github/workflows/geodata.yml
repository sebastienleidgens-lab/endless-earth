name: Import Angles real OSM geography
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download OSM data
        run: node scripts/fetch-angles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: angles-osm-geojson
          path: public/data/angles-osm.geojson
      - name: Commit verified OSM extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/angles-osm.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Import OpenStreetMap features for Angles-sur-l'Anglin"
            git push origin HEAD:main
          fi
