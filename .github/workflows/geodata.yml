name: Import Angles real OSM geography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/geodata.yml'
      - 'scripts/fetch-angles.mjs'
      - 'scripts/fetch-angles-osm.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download one-time OSM API village extract
        run: python3 scripts/fetch-angles-osm.py
      - name: Convert verified extract into world tiles
        run: node scripts/build-tiles.mjs public/data/angles-osm.geojson public/tiles 14
      - uses: actions/upload-artifact@v4
        with:
          name: angles-osm-geojson
          path: |
            public/data/angles-osm.geojson
            public/tiles/
      - name: Commit verified OSM extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/angles-osm.geojson public/tiles/
          if ! git diff --cached --quiet; then
            git commit -m "Import OpenStreetMap features for Angles-sur-l'Anglin"
            # Other development commits may land while the import runs.
            # Replay this data-only commit onto the newest main before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Import conflicts with concurrent changes; stopping safely."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push detected (attempt ${attempt}/5); retrying..."
              sleep 2
            done
            echo "Could not publish after five safe retries."
            exit 1
          fi
