name: Fetch Angles OSM geography
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-angles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: angles-osm-geojson
          path: public/data/angles-osm.geojson
