name: Import Angles real OSM geography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/geodata.yml'
      - 'scripts/fetch-angles.mjs'
      - 'scripts/fetch-angles-osm.py'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download one-time OSM API village extract
        run: python3 scripts/fetch-angles-osm.py
      - name: Convert verified extract into world tiles
        run: node scripts/build-tiles.mjs public/data/angles-osm.geojson public/tiles 14
      - uses: actions/upload-artifact@v4
        with:
          name: angles-osm-geojson
          path: |
            public/data/angles-osm.geojson
            public/tiles/
      - name: Commit verified OSM extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/angles-osm.geojson public/tiles/
          if ! git diff --cached --quiet; then
            git commit -m "Import OpenStreetMap features for Angles-sur-l'Anglin"
            git push origin HEAD:main
          fi
